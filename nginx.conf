# Portal RH (empleador): la app se sirve en la raíz de su propio dominio.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirecciones relativas: no pierden el puerto ni el dominio detrás de un proxy.
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Salud del contenedor.
  location = /salud { access_log off; default_type text/plain; return 200 "ok\n"; }

  # index.html nunca se guarda en caché: así cada despliegue se ve de inmediato.
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }

  # Archivos de src/assets: sin huella en el nombre, caché corta.
  location ^~ /assets/ { expires 1h; try_files $uri =404; }

  # JS, CSS y fuentes compilados llevan huella en el nombre: caché de un año.
  location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de la app (Angular): cualquier otra dirección carga index.html.
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
